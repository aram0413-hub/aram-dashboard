<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 화면 미리보기</title>
<style>
  body { margin: 0; padding: 16px; background: #2e2b3d; font-family: sans-serif; display: flex; gap: 16px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { color: #fff; font-size: 12px; padding: 6px 2px; }
  iframe { border: 0; border-radius: 12px; background: #fff; display: block; }
</style>
</head>
<body>
  <figure><figcaption>390px (일반 휴대폰)</figcaption><iframe src="index.html" width="390" height="844" title="390 미리보기"></iframe></figure>
  <figure><figcaption>344px (작은 화면)</figcaption><iframe src="index.html" width="344" height="844" title="344 미리보기"></iframe></figure>
</body>
</html>
