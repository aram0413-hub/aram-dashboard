<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 미리보기 (임시)</title>
<style>
  html, body { margin: 0; padding: 0; background: #e9e6f3; font-family: system-ui, sans-serif; }
  .stage { display: flex; gap: 28px; align-items: flex-start; justify-content: center; padding: 20px; }
  .phone { width: 390px; height: 844px; border-radius: 38px; overflow: hidden; box-shadow: 0 18px 50px rgba(40,34,66,.28); background: #fff; border: 9px solid #22202b; box-sizing: content-box; }
  .phone iframe { width: 390px; height: 844px; border: 0; display: block; }
  .cap { font-size: 12px; color: #5d5872; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="stage">
  <div>
    <div class="phone"><iframe src="./?t=mobile1#home" title="우리집 대시보드 모바일"></iframe></div>
    <p class="cap">390 × 844 (Galaxy Z Flip5 폭 기준)</p>
  </div>
</div>
</body>
</html>
